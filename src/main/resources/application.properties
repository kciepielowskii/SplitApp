spring.application.name=SplitApp
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# a request waits at most this long for a lock held by another transaction; after that
# PostgreSQL fails the statement and the API answers 409 instead of tying up a connection
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# the database error message contains the conflicting values, e.g. an email address
logging.level.org.hibernate.orm.jdbc.error=OFF

spring.web.locale=en
spring.web.locale-resolver=fixed
